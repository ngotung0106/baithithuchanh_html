<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Musical - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER + NAVIGATION (giống trang Home) -->
  <header>
    <a class="logo" href="index.html"><span>&#9835;</span> Musical</a>
    <nav>
      <a href="#">About Us</a>
      <a href="#">Music</a>
      <a href="#">Albums</a>
    </nav>
    <div class="auth">
      <a class="btn-in" href="login.html">Sign In</a>
      <a class="btn-up" href="#">Sign Up</a>
    </div>
  </header>

  <!-- LOGIN FORM -->
  <form class="login-box">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="admin@gmail.com">

    <label for="pass">Password</label>
    <input type="password" id="pass" placeholder="Password">

    <div class="row">
      <label style="font-size:13px; margin:0;"><input type="checkbox"> Remember Me</label>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit" class="login-btn">LOGIN</button>
    <div class="register">Not a member ? <a href="#">Register</a></div>
  </form>

  <!-- FOOTER -->
  <footer><span>&#9835;</span>Musical Entertainment<span>&#9835;</span></footer>

</body>
</html>
